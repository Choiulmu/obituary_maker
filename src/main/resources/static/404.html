<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f6f1">
    <title>부고장을 찾을 수 없습니다</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background: #ebe8e1;
            color: #2c2a27;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            font-size: 21px;
            line-height: 1.9;
            -webkit-font-smoothing: antialiased;
        }

        main {
            width: 100%;
            max-width: 430px;
            min-height: 100svh;
            margin: 0 auto;
            padding: 120px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: #f8f6f1;
        }

        .mark {
            width: 50px;
            height: 50px;
            margin-bottom: 30px;
            display: grid;
            place-items: center;
            border: 1px solid #ded9d0;
            border-radius: 50%;
            color: #81786c;
            font-family: "Iowan Old Style", "Baskerville", "Times New Roman", serif;
            font-size: 21px;
        }

        p { margin: 0; color: #77726a; }
    </style>
</head>
<body>
<main>
    <div class="mark">故</div>
    <p>부고장을 찾을 수 없습니다.<br>링크를 다시 확인해 주세요.</p>
</main>
</body>
</html>
